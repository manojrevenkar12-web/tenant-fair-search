<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" font-family="Inter, Segoe UI, sans-serif">
<rect width="760" height="300" fill="#fcfcfb"/>
<text x="20" y="28" font-size="15" font-weight="600" fill="#1d2421">The other shops' slowest searches (p99) while one shop's agent bursts</text>
<text x="20" y="47" font-size="12" fill="#59615d">Log scale; the same arrivals played against both admission modes</text>
<rect x="90" y="62" width="12" height="12" rx="2" fill="#2a78d6"/>
<text x="107" y="72" font-size="12" fill="#1d2421">Per-tenant admission</text>
<rect x="290" y="62" width="12" height="12" rx="2" fill="#eb6834"/>
<text x="307" y="72" font-size="12" fill="#1d2421">One shared queue</text>
<line x1="90" y1="250.0" x2="730" y2="250.0" stroke="#e3e6e4"/>
<text x="82" y="254.0" font-size="11" text-anchor="end" fill="#59615d">1 ms</text>
<line x1="90" y1="210.5" x2="730" y2="210.5" stroke="#e3e6e4"/>
<text x="82" y="214.5" font-size="11" text-anchor="end" fill="#59615d">10 ms</text>
<line x1="90" y1="171.0" x2="730" y2="171.0" stroke="#e3e6e4"/>
<text x="82" y="175.0" font-size="11" text-anchor="end" fill="#59615d">100 ms</text>
<line x1="90" y1="131.5" x2="730" y2="131.5" stroke="#e3e6e4"/>
<text x="82" y="135.5" font-size="11" text-anchor="end" fill="#59615d">1000 ms</text>
<line x1="90" y1="92.0" x2="730" y2="92.0" stroke="#e3e6e4"/>
<text x="82" y="96.0" font-size="11" text-anchor="end" fill="#59615d">10000 ms</text>
<text x="250.0" y="282" font-size="12" text-anchor="middle" fill="#1d2421">Before the burst</text>
<rect x="204.0" y="207.2" width="42" height="42.8" rx="3" fill="#2a78d6"><title>fair: 12 ms</title></rect>
<text x="225.0" y="201.2" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2421">12</text>
<rect x="254.0" y="211.2" width="42" height="38.8" rx="3" fill="#eb6834"><title>none: 10 ms</title></rect>
<text x="275.0" y="205.2" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2421">10</text>
<text x="570.0" y="282" font-size="12" text-anchor="middle" fill="#1d2421">During the burst</text>
<rect x="524.0" y="197.8" width="42" height="52.2" rx="3" fill="#2a78d6"><title>fair: 21 ms</title></rect>
<text x="545.0" y="191.8" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2421">21</text>
<rect x="574.0" y="117.5" width="42" height="132.5" rx="3" fill="#eb6834"><title>none: 2256 ms</title></rect>
<text x="595.0" y="111.5" font-size="11" font-weight="600" text-anchor="middle" fill="#1d2421">2,256</text>
