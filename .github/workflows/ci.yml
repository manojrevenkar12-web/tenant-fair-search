name: ci
on:
  push:
  pull_request:

jobs:
  scala:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: sbt}
      - uses: sbt/setup-sbt@v1
      - name: compile, unit tests (tokenizer fixture, parser, router, fusion, tenant scope, buckets), fat jar
        run: sbt -Dsbt.color=false "service/test" "service/assembly"

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: {python-version: "3.13", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: world, term model, metrics, gate, generated README
        run: python -m pytest -q
      - name: README results block matches the committed reports; both gates pass
        run: python -m tfs.eval.cli readme --check && python -m tfs.eval.cli gate && python -m tfs.eval.cli gate --heldout
      - name: the held-out worlds ran once and are locked
        run: test -f config/heldout.lock && test -f reports/heldout.json && ! python -m tfs.eval.cli heldout

  e2e:
    runs-on: ubuntu-24.04
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms1g -Xmx1g"
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: sbt}
      - uses: sbt/setup-sbt@v1
      - uses: actions/setup-python@v6
        with: {python-version: "3.13", cache: pip}
      - run: sbt -Dsbt.color=false "service/assembly"
      - run: pip install -r requirements-dev.txt
      - name: start the service against the cluster
        run: |
          TFS_EVAL_OVERRIDES=true nohup java -jar service/target/scala-3.3.4/tenant-fair-search.jar > service.log 2>&1 &
          for i in $(seq 1 90); do curl -fs localhost:8080/health && exit 0; sleep 1; done
          cat service.log; exit 1
      - name: one world end to end - train, index, every design, a burst
        run: python -m tfs.eval.cli smoke
      - if: always()
        run: tail -n 80 service.log

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: {package_json_file: web/package.json}
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml}
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - name: dashboard end to end on the committed reports, with axe
        run: pnpm e2e

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: "21", cache: sbt}
      - uses: sbt/setup-sbt@v1
      - run: sbt -Dsbt.color=false "service/assembly"
      - run: docker build -t tenant-fair-search:ci .

  infra:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_wrapper: false}
      - name: chart lints and renders to valid Kubernetes objects
        run: |
          helm lint deploy/helm/tenant-fair-search
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          helm template tfs deploy/helm/tenant-fair-search | ./kubeconform -strict -summary
      - name: terraform is formatted and valid
        run: |
          terraform -chdir=deploy/terraform fmt -check -diff
          terraform -chdir=deploy/terraform init -backend=false -input=false
          terraform -chdir=deploy/terraform validate
