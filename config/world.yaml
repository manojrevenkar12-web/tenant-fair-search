# The simulated world: shops, shoppers, AI agents and their history. Only the world and the evaluation read this.
seeds: [6101, 6102, 6103]

tenants:
  - {name: outdoor, kind: outdoor, products: 2400}
  - {name: fashion, kind: fashion, products: 2800}
  - {name: parts, kind: parts, products: 2000}
  - {name: home, kind: home, products: 2200}

products:
  in_stock: 0.85
  features: [1, 3]
  colour_in_title: 0.7

# Who searches, and how they phrase it.
queries:
  per_tenant: 320
  shapes:
    outdoor: {sku: 0.06, keyword: 0.44, sentence: 0.32, agent: 0.18}
    fashion: {sku: 0.04, keyword: 0.48, sentence: 0.30, agent: 0.18}
    parts:   {sku: 0.28, keyword: 0.38, sentence: 0.16, agent: 0.18}
    home:    {sku: 0.04, keyword: 0.46, sentence: 0.32, agent: 0.18}
  intent:
    colour: 0.4
    features: 0.5
    brand: 0.12
    size: 0.1
    max_price_sentence: 0.35
    max_price_agent: 0.6
    in_stock_agent: 0.5
    sku_lowercase: 0.5

# The history the platform can learn from: queries and what the shopper bought in the same session.
logs:
  sessions_per_tenant: 7000
  bought_relevant: 0.8
  sentence_share: 0.3

# One shop's AI shopping agent bursts while the other shops keep their usual traffic.
load:
  calibrate_seconds: 6
  calibrate_concurrency: 24
  warm_seconds: 4
  burst_seconds: 14
  cool_seconds: 4
  noisy_tenant: fashion
  noisy_times_capacity: 1.6
  quiet_share_of_capacity: 0.12
  client_timeout_seconds: 5
